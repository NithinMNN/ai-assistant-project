name: CI — Python tests & lints

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 black mypy pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Run unit tests
        run: |
          if [ -d tests ] || ls -1 | grep -E '(^tests$|test_.*\.py)' >/dev/null 2>&1; then
            pytest -q
          else
            echo "No tests found — skipping pytest."
          fi
          
      - name: Run type checks (optional)
        run: |
          if ls **/*.py >/dev/null 2>&1; then mypy . else echo "No Python files found — skipping mypy."; fi

      - name: Run linter
        run: |
          flake8 .

      - name: Check formatting
        run: |
          black --check .

  build-docs:
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.ref == 'refs/heads/main'   # only build docs for main branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Install docs deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install mkdocs mkdocs-material

      - name: Build docs (skip if mkdocs.yml missing)
        run: |
          if [ -f mkdocs.yml ]; then
            mkdocs build
          else
            echo "mkdocs.yml not found — skipping docs build."
          fi

